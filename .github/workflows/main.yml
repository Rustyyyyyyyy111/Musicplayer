name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK directly with Gradle
        run: |
          # Kiểm tra nếu có thư mục android bên trong thì vào đó, nếu không chạy trực tiếp tại gốc
          if [ -d "android" ]; then
            cd android
          fi
          
          # Nếu chưa có gradle wrapper, tạo tự động bằng lệnh gradle wrapper
          if [ ! -f "./gradlew" ]; then
            echo "Đang khởi tạo Gradle Wrapper..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk
